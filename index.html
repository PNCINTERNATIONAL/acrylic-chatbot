<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아크릴 주문 상담</title>
</head>
<body>
  <h2>아크릴 주문 상담</h2>

  <div id="chat" style="border:1px solid #ccc; height:300px; overflow:auto; padding:10px;"></div>

  <input
    id="input"
    placeholder="예: 투명 아크릴 150x150 5t 2개"
    style="width:80%;"
    onkeydown="if(event.key==='Enter') send();"
  >
  <button onclick="send()">전송</button>

  <script>
    // 🔹 대화 히스토리 저장 (핵심)
    const messages = [];

    async function send() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");

      const text = input.value.trim();
      if (!text) return;

      // 사용자 메시지 출력
      chat.innerHTML += `<div><b>고객님:</b> ${text}</div>`;
      input.value = "";

      // 🔹 히스토리에 사용자 발화 추가
      messages.push({
        role: "user",
        content: text
      });

      // 서버로 전체 대화 히스토리 전송
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages })
      });

      const data = await res.json();

      // 상담원 응답 출력
      chat.innerHTML += `<div><b>아트센:</b> ${data.reply}</div>`;
      chat.scrollTop = chat.scrollHeight;

      // 🔹 히스토리에 상담원 응답 추가
      messages.push({
        role: "assistant",
        content: data.reply
      });
    }
  </script>
</body>
</html>
