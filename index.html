<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>아크릴 주문 상담</title>
</head>
<body>
  <h2>아크릴 주문 상담</h2>

  <div id="chat" style="border:1px solid #ccc; height:300px; overflow:auto; padding:10px;"></div>

  <input id="input" placeholder="예: 투명 150x150 5t 2개" style="width:80%;"
         onkeydown="if(event.key==='Enter') send();">
  <button onclick="send()">전송</button>

  <script>
    // 🔹 대화 기록 (필수)
    const messages = [];

    // 🔹 인사 여부 (필수)
    let greeted = false;

    // 🔹 주문 상태 (필수)
    const orderState = {
      colorType: null,
      thickness: null,
      width: null,
      length: null,
      quantity: null
    };

    async function send() {
      const input = document.getElementById("input");
      const chat = document.getElementById("chat");
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div><b>나:</b> ${text}</div>`;
      input.value = "";

      messages.push({ role: "user", content: text });

      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages,
          greeted,
          orderState
        })
      });

      const data = await res.json();

      chat.innerHTML += `<div><b>상담원:</b> ${data.reply}</div>`;
      chat.scrollTop = chat.scrollHeight;

      messages.push({ role: "assistant", content: data.reply });

      // 🔹 첫 응답 이후엔 인사 완료로 처리
      if (!greeted) {
        greeted = true;
      }
    }
  </script>
</body>
</html>
